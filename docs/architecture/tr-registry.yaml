# Technical requirements — Path D retrofit.
# Authority: docs/WORLD.md, docs/CHARTER.md, godot/docs/ART.md.
# Do not invent pillars.

version: "2026-08-15"
engine: "Godot 4.4.1"

requirements:
  - id: TR-look-001
    gdd: design/art/art-bible.md
    system: painted-world
    requirement: Valley play is one painted warm-dusk bed, not PNG sticker crops.
    adr: ADR-0003
  - id: TR-look-002
    gdd: godot/docs/ART.md
    system: painted-world
    requirement: No leftover dusk RGB in transparent pixels; no rectangular sticker box.
    adr: ADR-0003
  - id: TR-look-003
    gdd: godot/docs/ART.md
    system: painted-world
    requirement: Players are cover-coat people (char-warm camel, char-pine olive). No Wilson / Don't Starve face.
    adr: ADR-0003
  - id: TR-look-004
    gdd: docs/CHARTER.md
    system: hud
    requirement: No sanity / 魂 / 精神值 HUD. Copy like 日 · 春 · 白天 · 金.
    adr: ADR-0003
  - id: TR-graph-001
    gdd: design/gdd/systems-index.md
    system: painted-world
    requirement: Play valley is a packed scene graph (bed + logic), not ValleyMap sticker stamps.
    adr: ADR-0001
  - id: TR-net-001
    gdd: docs/WORLD.md
    system: room-net
    requirement: Two phones join one room code and share one server snap.
    adr: ADR-0002
  - id: TR-net-002
    gdd: docs/CHARTER.md
    system: room-net
    requirement: Authority sim stays Node / WebSocket. Do not move the night into Godot.
    adr: ADR-0002
  - id: TR-play-001
    gdd: docs/WORLD.md
    system: move-do-shout
    requirement: Left stick moves. 做 acts. 喊 pings the other phone.
    adr: ADR-0001
  - id: TR-play-002
    gdd: docs/WORLD.md
    system: first-evening
    requirement: First evening can fish, mine, and cook from the same snap.
    adr: ADR-0002
  - id: TR-pair-001
    gdd: docs/WORLD.md
    system: togetherness
    requirement: Two phones must affect each other (pair fish / near / shout / sleep).
    adr: ADR-0002
